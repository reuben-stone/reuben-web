<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, height=630">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: #0e0f11;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #e0ddd5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 96px;
      overflow: hidden;
    }
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6b6862;
      margin-bottom: 28px;
    }
    h1 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 56px;
      font-weight: 600;
      line-height: 1.15;
      max-width: 900px;
      margin-bottom: 32px;
    }
    .desc {
      font-size: 20px;
      line-height: 1.6;
      color: #a8a5a0;
      max-width: 700px;
      margin-bottom: 40px;
    }
    .meta {
      display: flex;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #6b6862;
    }
    .meta span {
      padding: 4px 12px;
      border: 1px solid #2a2b30;
      border-radius: 3px;
    }
    .accent-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: #8b5cf6;
    }
  </style>
</head>
<body>
  <div class="accent-line"></div>
  <div class="eyebrow">Reuben Stone / Product Engineer</div>
  <h1>I build software products, and the systems behind them.</h1>
  <p class="desc">Senior product engineer with 10+ years building digital products. Recent work in AI-enabled systems, workflow architecture and interactive experiences.</p>
  <div class="meta">
    <span>React</span>
    <span>TypeScript</span>
    <span>Node.js</span>
    <span>AI Systems</span>
    <span>Electron</span>
    <span>Three.js</span>
  </div>
</body>
</html>
