<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1584, height=396">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1584px;
      height: 396px;
      background: #0e0f11;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #e0ddd5;
      overflow: hidden;
      position: relative;
    }
    .accent-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: #8b5cf6;
    }
    .content {
      position: absolute;
      top: 0;
      right: 0;
      width: 1100px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      padding-right: 96px;
      text-align: right;
    }
    h1 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 44px;
      font-weight: 600;
      line-height: 1.15;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 18px;
      color: #a8a5a0;
      margin-bottom: 20px;
    }
    .meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6b6862;
      margin-bottom: 16px;
    }
    .url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #8b5cf6;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="accent-line"></div>
  <div class="content">
    <h1>Reuben Stone</h1>
    <div class="subtitle">Senior Product Engineer</div>
    <div class="meta">Products / Systems / AI</div>
    <div class="url">reubenstone.co.uk</div>
  </div>
</body>
</html>
